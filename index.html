<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planets</title>

  <style>
      body {
          font-family: Cambria, sans-serif;
          background: #314f38;
          color: white;
          text-align: center;
      }

      button {
          padding: 8px 12px;
          margin: 5px;
          cursor: pointer;
      }

      #planets {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 15px;
      }

      .card {
          background: #9dc183;
          padding: 20px;
          width: 200px;
          border-radius: 10px;
      }

      .fact {
          display: none;
          margin-top: 10px;
      }

      .card.show .fact {
          display: block;
      }

      .delete {
          background: #4b5320;
          color: white;
          border: none;
      }
  </style>
</head>

<body>

<h1>Planets</h1>

<button id="orderBtn">Order: Closest → Farthest</button>
<button id="diameterBtn">Diameter: Smallest → Largest</button>

<div id="planets"></div>

<script>
  const planets = [
    {
      name: "Mercury",
      order: 1,
      diameterKm: 4879,
      funFact: "Mercury is the smallest and fastest planet in our solar system."
    },
    {
      name: "Venus",
      order: 2,
      diameterKm: 12104,
      funFact: "Venus is the hottest planet in our solar system."
    },
    {
      name: "Earth",
      order: 3,
      diameterKm: 12742,
      funFact: "Earth is not a perfect sphere, it bulges at the equator due to its rotation."
    },
    {
      name: "Mars",
      order: 4,
      diameterKm: 6794,
      funFact: "Mars features the largest volcano in the entire solar system."
    },
    {
      name: "Jupiter",
      order: 5,
      diameterKm: 142984,
      funFact: "Jupiter is the largest planet in our solar system."
    },
    {
      name: "Saturn",
      order: 6,
      diameterKm: 116464,
      funFact: "Saturn is the only planet in our solar system with an average density lower than water. It could float in a giant bathtub."
    },
    {
      name: "Uranus",
      order: 7,
      diameterKm: 51118,
      funFact: "Uranus rotates on its side with a 98-degree tilt."
    },
  ];

  const container = document.getElementById("planets");

  function displayPlanets() {
    container.innerHTML = "";

    planets.forEach((planet, index) => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
          <h2>${planet.name}</h2>
          <p>Order: ${planet.order}</p>
          <p>Diameter: ${planet.diameterKm} km</p>

          <p class="fact">${planet.funFact}</p>

          <button class="delete">Delete</button>
        `;

      // Show/hide fun fact
      card.addEventListener("click", () => {
        card.classList.toggle("show");
      });

      // Delete planet
      card.querySelector(".delete").addEventListener("click", (event) => {
        event.stopPropagation();
        planets.splice(index, 1);
        displayPlanets();
      });

      container.appendChild(card);
    });
  }

  let orderAscending = true;
  let diameterAscending = true;

  // Sort by distance from Sun
  document.getElementById("orderBtn").addEventListener("click", () => {
    planets.sort((a, b) =>
      orderAscending ? a.order - b.order : b.order - a.order
    );

    orderAscending = !orderAscending;
    displayPlanets();
  });

  // Sort by diameter
  document.getElementById("diameterBtn").addEventListener("click", () => {
    planets.sort((a, b) =>
      diameterAscending
        ? a.diameterKm - b.diameterKm
        : b.diameterKm - a.diameterKm
    );

    diameterAscending = !diameterAscending;
    displayPlanets();
  });

  displayPlanets();
</script>

</body>
</html>
